name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create --platforms=android --org com.siteinspector --project-name site_inspector .
      - name: Permissions and app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="متابعة المشرفين"#' $M
      - name: Disable lint tasks
        run: |
          mkdir -p ~/.gradle/init.d
          printf '%s\n' \
            'allprojects {' \
            '  tasks.configureEach { t ->' \
            '    if (t.name.startsWith("lintVital") || t.name.startsWith("lintAnalyze")) {' \
            '      t.enabled = false' \
            '    }' \
            '  }' \
            '}' > ~/.gradle/init.d/no-lint.gradle
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: site-inspector-apk
          path: build/app/outputs/flutter-apk/app-release.apk
